<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile Cards</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="b.css" />

    <script src="expert_layla.js" defer></script>
  </head>

  <body>
    <nav class="navbar navbar-expand-md bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand" href="index.html">🩺 MedExpert Q&A</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="experts_page.html">Experts</a></li>
            <li class="nav-item"><a class="nav-link" href="questions.html">Q&amp;A</a></li>
            <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="login.html">Log in</a></li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Register</a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="patient_registration.html">Patient</a></li>
                <li><a class="dropdown-item" href="expert_registration.html">Expert</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="row">
        <div class="col-sm-4 mb-3 mb-sm-0">
          <div class="card" style="text-align: center">
            <img src="no_profile.jpg" class="card-img-top" alt="..." />

            <div class="card-body">
              <h6 class="card-title">Dr. Layla Haddad</h6>

              <span class="badge text-bg-primary">Cardiology</span>

              <div class="rating">
                <span class="stars">★★★★★ 4.6</span><br />
                <span>20 rated responses</span>
              </div>

              <p class="card-text" style="text-align: center">
                Heart health,blood pressure and preventive care
              </p>

              <a href="#" class="btn btn-primary">Save Expert</a>
            </div>
          </div>
        </div>

        <div class="col-sm-8 mb-3 mb-sm-0">
          <div class="card">
            <h1 style="text-align: center"><b>Ask Layla a question</b></h1>

            <div style="padding-left: 10px">
              <h5>Your question</h5>

              <div class="form-floating" style="padding-bottom: 10px">
                <textarea
                  class="form-control"
                  placeholder="Leave a question here"
                  id="floatingTextarea2"
                  style="height: 100px"
                ></textarea>

                <label for="floatingTextarea2">
                  Describe your concern (at least 15 characters)
                </label>
              </div>

              <h5>Visibility</h5>

              <select
                class="form-select"
                aria-label="Default select example"
                style="padding-bottom: 10px"
              >
                <option selected>Public-others can read the answer</option>
                <option value="1">
                  Private-others can not read the answer
                </option>
              </select>

              <a href="#" class="btn btn-primary">Submit Question</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
