<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This line makes the page fit phone screens (needed for responsive design) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedExpert Q&A - Home</title>

  <!-- Bootstrap CSS from a CDN (a link, so nothing to download) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Our own CSS goes AFTER Bootstrap so it can override it -->
  <link href="css/b.css" rel="stylesheet">
</head>
<body>

  <!-- ===== NAVBAR (the team will share one version of this) =====
       navbar-expand-md: full menu on medium+ screens, hamburger button on phones -->
  <nav class="navbar navbar-expand-md bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand" href="index.html">🩺 MedExpert Q&A</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="experts.html">Experts</a></li>
          <li class="nav-item"><a class="nav-link" href="questions.html">Q&amp;A</a></li>
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Log in</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== HERO: big banner with a search box ===== -->
  <section class="hero">
    <div class="container">
      <h1>Trusted answers from real medical experts</h1>
      <p class="lead">Find a specialist, ask your question, and learn from answered questions.</p>

      <form id="searchForm" class="row g-2 justify-content-center mt-4">
        <div class="col-12 col-md-6">
          <input type="text" id="searchInput" class="form-control form-control-lg"
                 placeholder="Search by name or specialty">
        </div>
        <div class="col-12 col-md-auto">
          <button type="submit" class="btn btn-light btn-lg w-100">Find an expert</button>
        </div>
      </form>
    </div>
  </section>

  <!-- ===== TOP RATED EXPERTS (cards are filled in by js/home.js) ===== -->
  <div class="container my-5">
    <h2 class="mb-4">Top-rated experts</h2>
    <!-- row-cols-1 = 1 card per row on phones, row-cols-md-3 = 3 per row on bigger screens -->
    <div id="topExperts" class="row row-cols-1 row-cols-md-3 g-4"></div>

    <h2 class="mt-5 mb-4">Recently answered questions</h2>
    <div id="recentQuestions"></div>
    <a href="questions.html" class="btn btn-outline-secondary">See all questions</a>
  </div>

  <!-- Scripts go at the bottom so the page loads first.
       ORDER MATTERS: data.js must come before home.js because home.js uses its functions. -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
