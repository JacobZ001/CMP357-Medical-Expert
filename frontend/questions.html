<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedExpert Q&A - Answered Questions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/b.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-md bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand" href="index.html">🩺 MedExpert Q&A</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="experts.html">Experts</a></li>
          <li class="nav-item"><a class="nav-link active" href="questions.html">Q&amp;A</a></li>
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Log in</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <h1 class="mb-1">Answered public questions</h1>
    <p class="text-muted">Search what other people have already asked.</p>

    <!-- Search and filter bar -->
    <div class="row g-2 mb-3">
      <div class="col-12 col-md-8">
        <input type="text" id="searchBox" class="form-control"
               placeholder="Search questions or answers">
      </div>
      <div class="col-12 col-md-4">
        <select id="specialtyFilter" class="form-select">
          <option value="">All specialties</option>
          <!-- the other options are added by js/questions.js -->
        </select>
      </div>
    </div>

    <p id="resultCount" class="text-muted small"></p>

    <!-- The question cards are placed here by JavaScript -->
    <div id="questionList"></div>
  </div>

  <footer class="text-center text-muted py-4 border-top">
    CMP 357 project · Not real medical advice
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/questions.js"></script>
</body>
</html>
