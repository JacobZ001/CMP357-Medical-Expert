<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedExpert Q&A - Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="b.css" rel="stylesheet">
</head>
<body>

  <!-- Same navbar as the other pages -->
  <nav class="navbar navbar-expand-md bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand" href="index.html">🩺 MedExpert Q&A</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="experts_page.html">Experts</a></li>
          <li class="nav-item"><a class="nav-link" href="questions.html">Q&amp;A</a></li>
          <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Log in</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Register</a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="patient_registration.html">Patient</a></li>
              <li><a class="dropdown-item" href="expert_registration.html">Expert</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">

    <!-- Title + the drop-down that picks the patient view or one expert's view -->
    <div class="row g-3 align-items-end mb-4">
      <div class="col-12 col-md-7">
        <h1 class="mb-0">My dashboard</h1>
        <p class="text-muted mb-0">Track your questions and answers.</p>
      </div>
      <div class="col-12 col-md-5">
        <label for="viewSelect" class="form-label small text-muted">Showing</label>
        <select id="viewSelect" class="form-select"></select>
      </div>
    </div>

    <!-- dashboard.js puts the small number cards here -->
    <div id="stats" class="row row-cols-1 row-cols-sm-3 g-3 mb-4"></div>

    <h2 id="listTitle" class="mb-3"></h2>
    <!-- dashboard.js puts one card per question here -->
    <div id="questionList"></div>
  </div>

  <!-- Bootstrap confirmation pop-up, used before deleting anything -->
  <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="confirmTitle">Are you sure?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="confirmText"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmButton">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
